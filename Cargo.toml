[package]
name = "oxideav-opus"
version = "0.0.15"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-opus"
authors = ["Mark Karpeles"]
description = "Pure-Rust Opus audio codec (SILK + CELT + Hybrid) decoder and encoder for the oxideav framework."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-opus"
keywords = ["multimedia", "audio", "opus", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::audio"]
# The conformance reference decodes are test inputs read from disk when
# present; they stay out of the published package (10 MiB cap).
exclude = ["tests/fixtures/conformance/*.dec"]

[dependencies]
oxideav-core = "0.1"

[[bench]]
name = "codec_speed"
harness = false
